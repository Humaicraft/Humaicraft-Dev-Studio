<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Humaicraft Dev Studio</title>
  </head>
  <body>
    <main>
      <h1>Viewport</h1>
      <p class="intro">
        Apply an exact CSS viewport to the active tab, then reset when the check
        is complete.
      </p>

      <form id="viewport-form">
        <fieldset>
          <legend>Viewport size</legend>
          <label for="viewport-width">
            Width
            <input
              id="viewport-width"
              name="width"
              type="number"
              inputmode="numeric"
              min="320"
              max="7680"
              step="1"
              value="1280"
              required
            />
          </label>
          <label for="viewport-height">
            Height
            <input
              id="viewport-height"
              name="height"
              type="number"
              inputmode="numeric"
              min="240"
              max="4320"
              step="1"
              value="800"
              required
            />
          </label>
          <div class="actions">
            <button type="submit">Apply viewport</button>
            <button id="viewport-reset" class="secondary" type="button">
              Reset
            </button>
          </div>
        </fieldset>
      </form>

      <p
        id="viewport-status"
        class="status"
        data-state="idle"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      >
        Ready. This action affects only the active tab.
      </p>
    </main>
    <script type="module" src="/src/browser-extension/popup.ts"></script>
  </body>
</html>
